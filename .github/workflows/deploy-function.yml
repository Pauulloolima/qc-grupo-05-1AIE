name: Deploy Function QC

on:
  push:
    branches:
      - main
    paths:
      - 'aula03/function/**' 

permissions:
  id-token: write 
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: 'func-qc-h7g8u7' 
  PYTHON_VERSION: '3.11'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências, ruff e pytest
        run: |
          cd aula03/function
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar Lint (Ruff)
        run: |
          cd aula03/function
          ruff check .

      - name: Rodar Testes (Pytest)
        run: |
          cd aula03/function
          pytest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Autenticar no Azure via OIDC (Sem secret plaintext)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Instalar Azure Functions Core Tools
        run: npm i -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Deploy no Slot de Staging
        run: |
          cd aula03/function
          func azure functionapp publish ${{ env.AZURE_FUNCTIONAPP_NAME }} --python --slot staging

      - name: Trocar Slot (Swap Staging -> Produção)
        run: |
          az functionapp deployment slot swap --resource-group rg-qc-aula03-h7g8u7 --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --slot staging --target-slot production
